<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三甲銀行｜電子白板</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#243449;font-family:Arial,'Microsoft JhengHei',sans-serif}.app{max-width:1600px;margin:10px auto;padding:18px;background:#fff;border-radius:16px}header,.toolbar,.actions,.boardhead,.group{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}h1{margin:0;font-size:30px}.sub,.hint{color:#687b90}.sub{margin:5px 0}.hint{font-size:14px}.toolbar{background:#f0f5fb;padding:12px;border-radius:12px;margin:15px 0}.group{justify-content:flex-start}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;border:1px solid #cbd5e1;background:white;border-radius:8px;padding:10px 12px;font-weight:bold}button.selected{background:#1768c2;color:#fff}button.locked{background:#08784d;color:white}.actions{justify-content:flex-start;margin:12px 0}.boards{display:grid;grid-template-columns:1fr;gap:14px}.boards.double{grid-template-columns:repeat(2,minmax(0,1fr))}.board{min-width:0;border:1px solid #d8e2ef;border-radius:12px;padding:10px}.boardhead{margin-bottom:8px;font-weight:bold}.boardhead input{padding:6px;border:1px solid #cbd5e1;border-radius:7px}.scroll{overflow-x:auto}table{width:100%;table-layout:fixed;border-spacing:3px}th{background:#e6edf6;border-radius:5px;padding:9px 2px;font-size:22px}th:first-child,td:first-child{width:13%;overflow-wrap:anywhere}th:not(:first-child),td:not(:first-child){width:17.4%}th.item{text-align:left;padding:5px 8px;font-size:17px;background:#f0f4f9}small{display:block;font-size:12px;color:#6b7e90;font-weight:normal;margin-top:3px;overflow-wrap:anywhere}td{height:54px}.salary{width:100%;min-height:54px;padding:1px;font-size:20px;border:2px solid #dbe5f0;overflow-wrap:anywhere}.salary.active{background:#e6f0ff}.salary.bad{background:#fff0f2;color:#c42d44}.salary.good{background:#e8f8ee;color:#087c4d}.salary:disabled{opacity:1;cursor:default}.summary input{width:100%;min-width:0;height:49px;text-align:center;border:2px solid #bdccde;border-radius:7px;font-size:20px}.summary input:disabled{background:#edf2f7;color:#243449;opacity:1}.studentLock{width:100%;padding:9px 1px;font-size:clamp(11px,1.1vw,16px);white-space:nowrap}.student-lock-row th{font-size:14px}.editor{display:none;background:#f3f6fb;padding:12px;border-radius:10px;margin:12px 0}.editor.visible{display:block}.editrow{background:#fff;border:1px solid #d8e2ef;border-radius:10px;padding:12px;margin:10px 0}.edithead,.step,.editactions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:7px 0}.edithead input{width:min(260px,60vw)}.step input{width:min(220px,48vw)}.step label{min-width:65px}.editrow input{padding:9px;border:1px solid #cbd5e1;border-radius:7px}.danger{color:#b42335}.stepRemove{padding:7px 10px}.boards.double th{font-size:15px}.boards.double th.item{font-size:12px}.boards.double .salary{font-size:14px;min-height:43px}.boards.double td{height:43px}.boards.double .summary input{height:42px;font-size:15px}@media(max-width:800px){.app{padding:8px;margin:0}h1{font-size:25px}th:first-child,td:first-child{width:18%}th:not(:first-child),td:not(:first-child){width:16.4%}th{font-size:17px}th.item{font-size:12px;padding:3px}small{font-size:10px}.salary{font-size:15px;min-height:48px}td{height:48px}.boards.double{grid-template-columns:1fr}table{border-spacing:2px}.studentLock{font-size:11px;padding:7px 1px}}
</style></head><body><main class="app"><header><div><h1>三甲銀行</h1><p class="sub">老師登記薪水 → 鎖定薪水 → 學生自行填寫存入與結餘</p></div><button id="editBtn" aria-expanded="false">⚙ 編輯薪水項目</button></header><div class="actions"><button id="clear">清空目前表格</button><button id="full">全螢幕</button><button id="screenshot">📷 截圖儲存</button></div><div class="toolbar"><div class="group"><strong id="today"></strong><button id="single">單顯示</button><button id="double">雙顯示</button></div><div class="group"><button id="lock">🔓 鎖定薪水格</button><span id="status" class="hint"></span></div></div><section class="editor" id="editor"><h3>編輯薪水項目（名稱、點擊次數及內容）</h3><p class="hint">每個項目可獨立增加、刪除點擊次數，自由輸入 ✓、100、-100、109 × 4、x 等。留空代表空白；完成最後一次後回到空白，再次點擊從第一次開始。</p><div id="editorRows"></div><button type="button" id="addRow">＋ 新增薪水項目</button></section><div id="boards" class="boards"></div><p class="hint">薪水可整體鎖定；存入與結餘依日期及1至5號個別鎖定。不自動加總。資料儲存在目前裝置的瀏覽器，建議定期截圖保存。</p></main><script>
(function(){'use strict';
var defaults=[{n:'打掃清潔',a:100,b:200,t:'normal'},{n:'聯絡簿',t:'check'},{n:'刷牙擦桌',a:50,b:100,t:'normal'},{n:'自主管理',a:100,b:200,t:'normal'},{n:'主動完成',t:'complete'},{n:'幫助他人',a:100,b:200,t:'normal'},{n:'里長巡視',a:50,b:100,t:'normal'},{n:'通知回條',a:50,b:100,t:'normal'},{n:'回家作業',t:'check'},{n:'答案訂正',a:25,b:50,t:'normal'},{n:'補充考卷',a:50,b:100,t:'normal'}];
var $=id=>document.getElementById(id);function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function dateLabel(s){var p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);return p[0]+'年'+(+p[1])+'月'+(+p[2])+'日 星期'+'日一二三四五六'[d.getDay()]}
var yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);var key='class3A-bank-offline-v3';var state={rows:defaults,days:{},dates:[iso(new Date()),iso(yesterday)],mode:'single',locked:false,summaryLocked:false};try{var saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.rows)&&saved.days)state=saved}catch(e){}
// Migrate old 4-click settings: old second/third entries become editable steps.
state.rows.forEach(function(r){if(!Array.isArray(r.steps)){r.steps=['✓',String(r.a??''),String(r.b??''),'']}else{r.steps=r.steps.map(x=>String(x??''));if(!r.steps.length)r.steps=['']}});
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function record(date){if(!state.days[date])state.days[date]={cells:{},deposit:['','','','',''],total:['','','','','']};var r=state.days[date];if(!r.cells)r.cells={};['deposit','total'].forEach(k=>{if(!Array.isArray(r[k]))r[k]=['','','','','']});return r}
function locks(rec){if(!Array.isArray(rec.studentLocks))rec.studentLocks=Array(5).fill(!!state.summaryLocked);return rec.studentLocks}
function esc(v){return String(v).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function makeBoard(){var html='<div class="boardhead"><span class="boarddate"></span><input type="date" class="datepick" aria-label="選擇日期"></div><div class="scroll"><table><thead><tr><th>薪水項目</th>';for(var c=1;c<=5;c++)html+='<th>'+c+'</th>';html+='</tr></thead><tbody>';state.rows.forEach(function(row,r){html+='<tr><th class="item">'+esc(row.n)+'<small>'+esc(row.steps.join(' → '))+'</small></th>';for(var c=0;c<5;c++)html+='<td><button type="button" class="salary" data-row="'+r+'" data-col="'+c+'" aria-label="'+esc(row.n)+' '+(c+1)+'號"></button></td>';html+='</tr>'});['deposit','total'].forEach(function(field){html+='<tr class="summary"><th class="item">'+(field==='deposit'?'存入':'結餘')+'</th>';for(var c=0;c<5;c++)html+='<td><input inputmode="numeric" data-field="'+field+'" data-col="'+c+'" aria-label="'+(c+1)+'號'+(field==='deposit'?'存入':'結餘')+'"></td>';html+='</tr>'});html+='<tr class="student-lock-row"><th class="item">鎖定存入與結餘</th>';for(var c=0;c<5;c++)html+='<td><button type="button" class="studentLock" data-col="'+c+'"></button></td>';return html+'</tr></tbody></table></div>'}
function refresh(board,index){var date=state.dates[index],rec=record(date);board.querySelector('.boarddate').textContent=dateLabel(date);board.querySelector('.datepick').value=date;board.querySelectorAll('.salary').forEach(function(btn){var r=+btn.dataset.row,c=+btn.dataset.col,v=rec.cells[r+'-'+c]||0,steps=state.rows[r].steps;if(v>steps.length){v=0;rec.cells[r+'-'+c]=0}var value=v?steps[v-1]:'';btn.textContent=value;btn.disabled=!!state.locked;btn.className='salary'+(v?' active':'')+(value==='✓'||value==='✔'?' good':'')+(String(value).trim().startsWith('-')?' bad':'')});board.querySelectorAll('input[data-field]').forEach(function(inp){inp.value=rec[inp.dataset.field][+inp.dataset.col]??'';inp.disabled=!!locks(rec)[+inp.dataset.col]});board.querySelectorAll('.studentLock').forEach(function(btn){var l=!!locks(rec)[+btn.dataset.col];btn.textContent=(+btn.dataset.col+1)+'號 '+(l?'🔒 已鎖':'🔓 鎖定');btn.classList.toggle('locked',l)})}
function render(){var host=$('boards');host.innerHTML='';for(var i=0;i<(state.mode==='double'?2:1);i++){var b=document.createElement('section');b.className='board';b.id='board'+i;b.innerHTML=makeBoard();host.appendChild(b);refresh(b,i)}host.className='boards'+(state.mode==='double'?' double':'');$('single').classList.toggle('selected',state.mode==='single');$('double').classList.toggle('selected',state.mode==='double');$('lock').textContent=state.locked?'🔒 解鎖薪水格':'🔓 鎖定薪水格';$('lock').classList.toggle('locked',state.locked);$('status').textContent=state.locked?'薪水已鎖定':'目前可登記薪水';$('today').textContent='今天：'+dateLabel(iso(new Date()));save()}
function boardIndex(el){return el.closest('.board').id==='board1'?1:0}
$('boards').addEventListener('click',function(e){var btn=e.target.closest('.salary');if(!btn||state.locked)return;var i=boardIndex(btn),rec=record(state.dates[i]),r=+btn.dataset.row,c=+btn.dataset.col,k=r+'-'+c,row=state.rows[r],next=((rec.cells[k]||0)+1)%(row.steps.length+1);rec.cells[k]=next;
// Auto-complete the four basic tasks for the same student, retaining previous manual values.
var targets=['自主管理','刷牙擦桌','聯絡簿','打掃清潔'];if(!rec.autoCompleted)rec.autoCompleted={};if(row.n.trim()==='主動完成'){var track=String(c);if(next!==0){if(!rec.autoCompleted[track])rec.autoCompleted[track]={};targets.forEach(function(name){var idx=state.rows.findIndex(x=>x.n.trim()===name);if(idx<0)return;var ck=idx+'-'+c;if(!Object.prototype.hasOwnProperty.call(rec.autoCompleted[track],ck))rec.autoCompleted[track][ck]=rec.cells[ck]||0;rec.cells[ck]=1})}else if(rec.autoCompleted[track]){Object.keys(rec.autoCompleted[track]).forEach(function(ck){if(rec.cells[ck]===1)rec.cells[ck]=rec.autoCompleted[track][ck]});delete rec.autoCompleted[track]}}else{var auto=rec.autoCompleted[String(c)];if(auto&&Object.prototype.hasOwnProperty.call(auto,k))delete auto[k]}
refresh(btn.closest('.board'),i);save()});
$('boards').addEventListener('click',function(e){var btn=e.target.closest('.studentLock');if(!btn)return;var i=boardIndex(btn),rec=record(state.dates[i]),c=+btn.dataset.col;locks(rec)[c]=!locks(rec)[c];refresh(btn.closest('.board'),i);save()});
$('boards').addEventListener('input',function(e){var el=e.target;if(!el.matches('input[data-field]'))return;var rec=record(state.dates[boardIndex(el)]);if(locks(rec)[+el.dataset.col])return;rec[el.dataset.field][+el.dataset.col]=el.value;save()});
$('boards').addEventListener('change',function(e){var el=e.target;if(!el.matches('.datepick')||!el.value)return;var i=boardIndex(el);if(state.mode==='double'&&state.dates[1-i]===el.value){alert('請選擇不同日期');render();return}state.dates[i]=el.value;render()});
$('single').onclick=function(){state.mode='single';render()};$('double').onclick=function(){state.mode='double';render()};$('lock').onclick=function(){state.locked=!state.locked;render()};$('clear').onclick=function(){if(!confirm('確定清空目前顯示日期的紀錄嗎？'))return;state.dates.slice(0,state.mode==='double'?2:1).forEach(d=>{state.days[d]={cells:{},deposit:['','','','',''],total:['','','','','']}});render()};
$('editBtn').onclick=function(){var ed=$('editor'),open=!ed.classList.contains('visible');ed.classList.toggle('visible',open);this.setAttribute('aria-expanded',String(open));if(open){renderEditor();ed.scrollIntoView({behavior:'smooth',block:'nearest'})}};
function shiftCellsAfterDelete(index){Object.keys(state.days).forEach(function(date){var rec=state.days[date],newCells={};Object.keys(rec.cells||{}).forEach(function(k){var p=k.split('-'),r=+p[0];if(r!==index)newCells[(r>index?r-1:r)+'-'+p[1]]=rec.cells[k]});rec.cells=newCells;delete rec.autoCompleted})}
function renderEditor(){var host=$('editorRows');host.innerHTML='';state.rows.forEach(function(row,i){var div=document.createElement('div');div.className='editrow';var head=document.createElement('div');head.className='edithead';var name=document.createElement('input');name.value=row.n;name.placeholder='薪水項目名稱';name.setAttribute('aria-label','項目名稱');name.onchange=function(){row.n=name.value.trim()||row.n;render()};head.appendChild(name);var del=document.createElement('button');del.className='danger';del.textContent='刪除整個項目';del.onclick=function(){if(!confirm('確定刪除「'+row.n+'」？'))return;state.rows.splice(i,1);shiftCellsAfterDelete(i);renderEditor();render()};head.appendChild(del);div.appendChild(head);
row.steps.forEach(function(value,j){var line=document.createElement('div');line.className='step';var label=document.createElement('label');label.textContent='第'+(j+1)+'次';line.appendChild(label);var input=document.createElement('input');input.value=value;input.placeholder='留空即顯示空白';input.setAttribute('aria-label',row.n+' 第'+(j+1)+'次內容');input.oninput=function(){row.steps[j]=input.value;save()};input.onchange=function(){render()};line.appendChild(input);var remove=document.createElement('button');remove.className='danger stepRemove';remove.textContent='刪除這次';remove.disabled=row.steps.length===1;remove.onclick=function(){row.steps.splice(j,1);Object.values(state.days).forEach(function(rec){Object.keys(rec.cells||{}).forEach(function(k){if(+k.split('-')[0]!==i)return;var v=rec.cells[k];if(v===j+1)rec.cells[k]=0;else if(v>j+1)rec.cells[k]=v-1})});renderEditor();render()};line.appendChild(remove);div.appendChild(line)});var actions=document.createElement('div');actions.className='editactions';var add=document.createElement('button');add.textContent='＋ 新增點擊次數';add.onclick=function(){row.steps.push('');renderEditor();render()};actions.appendChild(add);div.appendChild(actions);host.appendChild(div)})}
$('addRow').onclick=function(){state.rows.push({n:'新項目',steps:['✓','50','100','']});renderEditor();render()};
$('screenshot').onclick=async function(){var btn=this,old=btn.textContent;btn.disabled=true;btn.textContent='正在製作圖片…';try{if(!window.html2canvas)await new Promise(function(resolve,reject){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});var canvas=await html2canvas($('boards'),{backgroundColor:'#fff',scale:2,useCORS:true,scrollX:0,scrollY:0,windowWidth:document.documentElement.scrollWidth});var blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('轉換失敗');var filename='三甲銀行_薪水表_'+state.dates[0]+'.png',file=new File([blob],filename,{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'三甲銀行薪水表'});return}catch(err){if(err.name==='AbortError')return}}var url=URL.createObjectURL(blob),preview=window.open('','_blank');if(preview){preview.document.write('<!doctype html><html lang="zh-Hant"><meta name="viewport" content="width=device-width,initial-scale=1"><title>薪水表圖片</title><body style="text-align:center;font-family:sans-serif"><p>長按圖片，選擇「儲存到照片」</p><img id="shot" style="max-width:100%;height:auto"></body>');preview.document.close();preview.document.getElementById('shot').src=url}else{var a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove()}setTimeout(()=>URL.revokeObjectURL(url),120000)}catch(e){alert('無法產生截圖。請確認網路連線，或使用裝置內建截圖功能。')}finally{btn.disabled=false;btn.textContent=old}};
$('full').onclick=function(){if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()};render();
})();
</script></body></html>
